<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Misa app</title>
<style>
  :root { color-scheme: light; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    margin: 0; padding: 16px; background: #f6f5ef; color: #171a2b;
  }
  #misa-root { max-width: 640px; margin: 0 auto; }
  .misa-screen { display: flex; flex-direction: column; gap: 8px; }
  .misa-screen p { margin: 0; }
  .misa-banner {
    padding: 10px 14px; border-radius: 8px; font-weight: 500;
  }
  .misa-banner-info    { background: #e3e7ff; color: #151a46; }
  .misa-banner-warning { background: #fff3d6; color: #6b4e00; }
  .misa-banner-error   { background: #ffe0da; color: #8f1d0e; }
  .misa-dismissible { position: relative; padding-right: 40px; }
  .misa-dismiss {
    position: absolute; top: 6px; right: 8px;
    border: none; background: transparent; font-size: 18px;
    cursor: pointer; color: inherit;
  }
  button {
    padding: 10px 18px; border: none; border-radius: 8px;
    background: #5548f5; color: #fff; font-size: 15px; cursor: pointer;
  }
  button:active { transform: translateY(1px); }
  input[type="text"] {
    padding: 10px 12px; border: 1px solid #c9c7bd; border-radius: 8px;
    font-size: 15px; width: 100%; box-sizing: border-box;
  }
  .misa-image { max-width: 100%; border-radius: 8px; }
  #misa-loading { color: #6b6f85; }
</style>
</head>
<body>
<div id="misa-root"><p id="misa-loading">loading&hellip;</p></div>
<script>
  // Environment bridge (P3): query params become window.MISA_ENV.
  //   ?env_FOO=bar  -> MISA_ENV.FOO = "bar"
  //   ?mock=/p     -> MISA_ENV.MISA_MOCK_FILE = "/p"
  // Provider keys are supplied by the page and NEVER baked into the
  // wasm binary.
  window.MISA_ENV = {};
  for (const [k, v] of new URLSearchParams(location.search)) {
    if (k === 'mock') window.MISA_ENV.MISA_MOCK_FILE = v;
    else if (k.startsWith('env_')) window.MISA_ENV[k.slice(4)] = v;
  }
  window.misaBootError = null;
  window.addEventListener('error', function(ev) {
    window.misaBootError = String((ev && ev.message) || ev);
  });
</script>
<script>
  // MODULARIZE=1: the app script defines the MisaModule() factory.
  // ?app=foo.js selects the app script (default misa.js).
  (function() {
    var appJs = new URLSearchParams(location.search).get('app') || 'misa.js';
    var s = document.createElement('script');
    s.src = appJs;
    s.onload = function() { window.misaAppLoaded = true; bootMisa(); };
    s.onerror = function() {
      window.misaBootError = 'failed to load ' + appJs;
      console.error(window.misaBootError);
    };
    document.head.appendChild(s);
  })();

  function bootMisa() {
    // MODULARIZE=1: misa.js defines the MisaModule() factory.
    MisaModule().then(function(Module) {
    var loading = document.getElementById('misa-loading');
    // IDBFS bootstrap (blocking via Asyncify): previously persisted
    // files under /misa_fs become visible before the app boots.
    try {
      Module.ccall('misa_platform_fs_bootstrap', null, [], []);
    } catch (e) {
      console.error('misa: fs bootstrap failed', e);
    }
    try {
      Module.ccall('misa_ui_boot', null, [], []);
    } catch (e) {
      console.error('misa: boot failed', e);
      window.misaBootError = String((e && e.message) || e);
    }
    if (loading && loading.parentNode)
      loading.parentNode.removeChild(loading);
    window.misaReady = true;
    }).catch(function(e) {
      console.error('misa: module load failed', e);
      window.misaBootError = String((e && e.message) || e);
    });
  }
</script>
</body>
</html>
