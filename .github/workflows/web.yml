name: web-target
# Verifies the Emscripten web target in a NETWORKED browser (GitHub's
# Chrome has real network access, unlike the build sandbox).
# Two layers:
#   1. Stub layer (always): model calls POST to the local OpenAI-protocol
#      stub; proves the full transport mechanics end-to-end.
#   2. Live layer (only when the repo has a MISA_LIVE_API_KEY secret):
#      a real model call against the provider. The key is supplied by the
#      repo owner in Settings -> Secrets; it is never baked into the wasm.
on: [push, pull_request, workflow_dispatch]
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install llvmlite==0.50.0
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git /tmp/emsdk
          cd /tmp/emsdk && ./emsdk install 4.0.10 && ./emsdk activate 4.0.10
      - name: Build web apps
        run: |
          chmod +x impl/bin/misa
          source /tmp/emsdk/emsdk_env.sh
          ./impl/bin/misa build examples/webslice.misa --target wasm32-unknown-emscripten -o web/misa.js --preload-file examples/webslice.mock.json@/mock.json
          ./impl/bin/misa build examples/webmodel.misa --target wasm32-unknown-emscripten -o web/webmodel.js
          ./impl/bin/misa build examples/webmodel_live.misa --target wasm32-unknown-emscripten -o web/webmodel_live.js
          ./impl/bin/misa build examples/plantdoc.misa --target wasm32-unknown-emscripten -o web/plantdoc.js --preload-file examples/plantdoc.mock.json@/mock.json
          ls -la web/misa.wasm web/webmodel.wasm web/plantdoc.wasm
      - name: Install test deps
        run: cd tests/web && npm install --no-audit --no-fund ws
      - name: Start stub server and Chrome
        run: |
          cd $GITHUB_WORKSPACE/tests/web
          MISA_WEB_DIR=$GITHUB_WORKSPACE/web nohup python3 stub_server.py 8471 > /tmp/stub.log 2>&1 &
          google-chrome --headless --no-sandbox --disable-gpu --remote-debugging-port=9222 --allow-file-access-from-files about:blank > /tmp/chrome.log 2>&1 &
          # Wait for Chrome's DevTools port instead of a blind sleep:
          # on a loaded runner Chrome can take longer than 6s to listen.
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9222/json/version > /dev/null 2>&1; then
              echo "chrome DevTools up after ${i}s"; break
            fi
            sleep 1
          done
          curl -sf http://localhost:9222/json/version > /dev/null 2>&1 || { echo "chrome never listened:"; cat /tmp/chrome.log; exit 1; }
      - name: Web checks (stub layer)
        run: |
          cd $GITHUB_WORKSPACE/tests/web
          export MISA_WEB_BASE="http://localhost:8471"
          export MISA_ROOT="$GITHUB_WORKSPACE"
          node cdp_web_test.js "$MISA_WEB_BASE"
          node cdp_web_m5_test.js
      - name: PlantDoc demo checks
        run: |
          cd $GITHUB_WORKSPACE/tests/web
          export MISA_WEB_BASE="http://localhost:8471"
          node cdp_plantdoc_test.js "$MISA_WEB_BASE"
      - name: Live provider check (optional, needs MISA_LIVE_API_KEY secret)
        # NOTE: `secrets` may not be used in a step-level `if:` (GitHub
        # rejects the whole workflow). Gate on the env var in shell instead.
        env:
          MISA_LIVE_API_KEY: ${{ secrets.MISA_LIVE_API_KEY }}
        run: |
          if [ -z "$MISA_LIVE_API_KEY" ]; then
            echo "No MISA_LIVE_API_KEY secret configured; skipping live provider check."
            exit 0
          fi
          cd $GITHUB_WORKSPACE/tests/web
          export MISA_WEB_BASE="http://localhost:8471"
          node cdp_web_live_test.js
