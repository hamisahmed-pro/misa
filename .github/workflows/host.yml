name: host
on: [push, pull_request, workflow_dispatch]
jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install native AOT runtime dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libgc-dev
      - run: pip install llvmlite==0.50.0 onnxruntime==1.21.0 onnx==1.17.0
      - name: Vendor ONNX Runtime C library (AOT on-device, M2)
        run: |
          mkdir -p ~/workspace/deps/ort
          cd ~/workspace/deps/ort
          curl -sSL -o onnxruntime-linux-x64-1.21.0.tgz \
            https://github.com/microsoft/onnxruntime/releases/download/v1.21.0/onnxruntime-linux-x64-1.21.0.tgz
          tar xzf onnxruntime-linux-x64-1.21.0.tgz
      - name: Fetch SQLite amalgamation (AOT db.*, Phase 5)
        run: python3 scripts/fetch_sqlite.py
      - name: MIR structural and optimization gate
        run: python3 tests/test_mir.py
      - name: Generated project status consistency
        run: python3 tools/gen_readme.py --check
      - name: AST to MIR lowering gate
        run: python3 tests/test_mir_lower.py
      - name: Benchmark harness contract gate
        run: python3 tests/test_benchmark.py
      - name: Platform ABI contract gate
        run: python3 tests/test_platform_abi.py
      - name: Interpreter suite
        run: |
          chmod +x impl/bin/misa
          python3 tests/run_tests.py
      - name: AOT parity suite
        run: python3 tests/aot/run_aot_tests.py
      - name: AOT symbol-preservation regression test
        run: python3 tests/aot/test_symbol_preservation.py
      - name: AOT allocation churn and GC memory smoke test
        run: python3 tests/aot/test_memory_stress.py
      - name: Platform capability matrix
        run: python3 - <<'PY'
import json
p=json.load(open("spec/platform.json"))
assert p["version"] == "1.0.0"
assert "x86_64-unknown-linux-gnu" in p["targets"]
for t,v in p["targets"].items():
    assert "capabilities" in v and "status" in v
print("platform matrix OK")
PY
      - name: On-device AI suite (M1)
        run: python3 tests/ondevice/run_ondevice_tests.py
      - name: On-device AOT suite (M2)
        run: python3 tests/aot/test_ondevice.py
