name: android-emulator
# Boots the Misa APK on a real (emulated) Android phone in CI and proves
# the app launches and renders. This is the device-level verification
# the build sandbox cannot do (no device/emulator there).
on: [push, workflow_dispatch]
jobs:
  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install llvmlite==0.50.0
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - name: Install Android SDK pieces
        run: |
          export ANDROID_HOME=$HOME/workspace/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          curl -sL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip && mv cmdline-tools latest
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;34.0.0"
          # build_apk.py expects the pinned build-tools dir name:
          cp -r $ANDROID_HOME/build-tools/34.0.0 $ANDROID_HOME/build-tools/android-14
          # build_apk.py expects the JDK at ~/workspace/tools/jdk-21:
          mkdir -p $HOME/workspace/tools && ln -sfn $JAVA_HOME $HOME/workspace/tools/jdk-21
      - name: Download Android NDK r27d
        run: |
          mkdir -p ~/workspace/android-ndk && cd ~/workspace/android-ndk
          curl -sL -o ndk.zip https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip -q ndk.zip
          ls android-ndk-r27d/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android34-clang
      - name: Build x86_64 APK (emulator ABI)
        run: |
          cd $GITHUB_WORKSPACE
          python3 scripts/build_apk.py --misa examples/android.misa --abis x64 --out /tmp/misa.apk
          ls -la /tmp/misa.apk
      - name: Free disk for the emulator
        # The emulator needs ~7.4GB free for its userdata partition.
        # The NDK (~4GB) and our SDK copy (~1GB) are no longer needed
        # after the APK is built; the emulator action installs its own
        # SDK pieces separately.
        run: |
          rm -rf ~/workspace/android-ndk ~/workspace/android-sdk
          df -h / | tail -1
      - name: Boot app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          script: |
            adb install /tmp/misa.apk
            adb shell am start -n com.misa.app/.MisaActivity
            sleep 10
            adb shell pidof com.misa.app
            adb exec-out screencap -p > /tmp/misa-screen.png
            adb logcat -d | grep -i "misa" | head -20 || true
      - name: Upload emulator screenshot
        uses: actions/upload-artifact@v4
        with:
          name: misa-emulator-screenshot
          path: /tmp/misa-screen.png
